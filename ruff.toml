# Lint rules the project actually enforces. Deliberately small: real errors,
# undefined names, unused imports and import order. Style opinions beyond that
# are not worth failing a build over on a project this size.
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
"tests/*" = ["E402"]
