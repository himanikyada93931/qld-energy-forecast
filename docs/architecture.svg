<svg xmlns="http://www.w3.org/2000/svg" width="860" height="630" viewBox="0 0 860 630" role="img" aria-label="System architecture of the Queensland electricity demand forecasting service" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Architecture — Queensland electricity demand forecasting</title>
<desc>Data flows from AEMO and Open-Meteo through a daily ingest into SQLite on a persistent volume, then to a gradient boosting model served by FastAPI in a Docker container on Railway. A background thread re-runs the ingest every six hours.</desc>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="860" height="630" fill="#ffffff"/>

<rect x="30" y="30" width="740" height="86" rx="8" fill="#f7f6f3" stroke="#d5d2c8" stroke-width="1"/>
<text x="46" y="52" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F3864">Public data sources</text>
<rect x="50" y="62" width="340" height="44" rx="6" fill="#ffffff" stroke="#c9c5b8" stroke-width="1"/>
<text x="66" y="80" font-family="Arial, sans-serif" font-size="13" fill="#3d3d3a">AEMO — Queensland demand and price</text>
<text x="66" y="97" font-family="Arial, sans-serif" font-size="11" fill="#73726c">5-minute intervals, CSV per month</text>
<rect x="410" y="62" width="340" height="44" rx="6" fill="#ffffff" stroke="#c9c5b8" stroke-width="1"/>
<text x="426" y="80" font-family="Arial, sans-serif" font-size="13" fill="#3d3d3a">Open-Meteo — weather</text>
<text x="426" y="97" font-family="Arial, sans-serif" font-size="11" fill="#73726c">archive (history) + forecast (next 3 days)</text>

<line x1="400" y1="120" x2="400" y2="152" stroke="#73726c" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="30" y="156" width="740" height="62" rx="8" fill="#f7f6f3" stroke="#d5d2c8" stroke-width="1"/>
<text x="46" y="178" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F3864">Ingest</text>
<text x="46" y="200" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">fetch with retry and backoff  →  raw files kept unmodified  →  convert to UTC, resample to hourly, join</text>

<line x1="400" y1="222" x2="400" y2="254" stroke="#73726c" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="30" y="258" width="740" height="96" rx="8" fill="#f7f6f3" stroke="#d5d2c8" stroke-width="1"/>
<text x="46" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F3864">SQLite — on a persistent volume</text>
<rect x="50" y="292" width="222" height="48" rx="6" fill="#ffffff" stroke="#c9c5b8" stroke-width="1"/>
<text x="64" y="311" font-family="Arial, sans-serif" font-size="13" fill="#3d3d3a">observations</text>
<text x="64" y="328" font-family="Arial, sans-serif" font-size="11" fill="#73726c">~18,800 hourly rows</text>
<rect x="287" y="292" width="222" height="48" rx="6" fill="#ffffff" stroke="#c9c5b8" stroke-width="1"/>
<text x="301" y="311" font-family="Arial, sans-serif" font-size="13" fill="#3d3d3a">weather_future</text>
<text x="301" y="328" font-family="Arial, sans-serif" font-size="11" fill="#73726c">hours with no demand yet</text>
<rect x="524" y="292" width="222" height="48" rx="6" fill="#ffffff" stroke="#c9c5b8" stroke-width="1"/>
<text x="538" y="311" font-family="Arial, sans-serif" font-size="13" fill="#3d3d3a">predictions</text>
<text x="538" y="328" font-family="Arial, sans-serif" font-size="11" fill="#73726c">logged, scored once actual</text>

<line x1="400" y1="358" x2="400" y2="390" stroke="#73726c" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="30" y="394" width="740" height="62" rx="8" fill="#f7f6f3" stroke="#d5d2c8" stroke-width="1"/>
<text x="46" y="416" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F3864">Model</text>
<text x="46" y="438" font-family="Arial, sans-serif" font-size="12" fill="#3d3d3a">20 features (cyclical time, lags, degree days, solar)  →  gradient boosting  →  140 MW MAE vs 303 MW baseline</text>

<line x1="400" y1="460" x2="400" y2="492" stroke="#73726c" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="30" y="496" width="740" height="86" rx="8" fill="#f7f6f3" stroke="#d5d2c8" stroke-width="1"/>
<text x="46" y="518" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F3864">FastAPI — Docker container on Railway</text>
<rect x="50" y="530" width="222" height="38" rx="6" fill="#ffffff" stroke="#c9c5b8" stroke-width="1"/>
<text x="64" y="554" font-family="Arial, sans-serif" font-size="13" fill="#3d3d3a">/health</text>
<rect x="287" y="530" width="222" height="38" rx="6" fill="#ffffff" stroke="#c9c5b8" stroke-width="1"/>
<text x="301" y="554" font-family="Arial, sans-serif" font-size="13" fill="#3d3d3a">/predict</text>
<rect x="524" y="530" width="222" height="38" rx="6" fill="#ffffff" stroke="#c9c5b8" stroke-width="1"/>
<text x="538" y="554" font-family="Arial, sans-serif" font-size="13" fill="#3d3d3a">/forecast</text>

<path d="M770 539 L810 539 L810 187 L774 187" fill="none" stroke="#73726c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>

<text x="30" y="608" font-family="Arial, sans-serif" font-size="12" fill="#73726c">Dashed line: a background thread re-runs the ingest every 6 hours, so the deployed service keeps its own data current.</text>

</svg>
